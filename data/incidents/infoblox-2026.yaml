summary: >
  TechCrunch (Infoblox spokesperson): Infoblox is investigating "a security event involving unauthorized access to certain company
  information through a compromised third-party data migration vendor". According to TechCrunch's sources the vendor handles SharePoint data
  migration and one source said sensitive customer data was taken; Infoblox would not say how many customers were affected. Infoblox has
  "no indication that any Infoblox products, cloud services, software updates or build-and-release processes were involved". The vendor and
  the attacker were not named.
