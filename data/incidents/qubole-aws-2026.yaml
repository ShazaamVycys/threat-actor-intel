id: qubole-aws-2026
name: Qubole cross-account AWS access abused to breach customer cloud environments
category: supply-chain
status: contained
activity: 2026-10 (role assumptions 14-26 Oct)
disclosed: 2026-11-09
updated: 2026-11-20
victims: >
  Dozens of Qubole customers' AWS environments (Sentra); downstream exposure reported by J.P. Morgan Chase (marketing data: some
  customer names and email addresses), Mastercard (email addresses of a small subset of cardholders in one benefit program) and
  Visa (an Asia Pacific provider; Visa's systems not involved)
sectors: [Technology, Cloud, Financial services]
countries: [Global]
watch: true
keywords: [Qubole, n0n, quiam, Idera, sso_agent.iso]
attribution: CRIMINAL
actors:
  - name: n0n
    attribution: "Wiz (11 Nov update, citing Risky Business): an actor calling themselves \"n0n\" claimed responsibility; Wiz: no ties to other public activity, targeting \"opportunistic\" and not typical of state-backed priorities. BleepingComputer: n0n ransomware group claimed the Qubole attack"
summary: >
  Wiz (with Sentra and Mandiant): between 14 and 26 Oct 2026 an actor used IAM credentials of two IAM users in the AWS account
  Qubole's platform uses (805246085872) to assume IAM roles customers had created to trust Qubole, then enumerated accounts,
  harvested secrets from Lambda, Secrets Manager and SSM, validated AWS, Entra ID and Okta credentials with TruffleHog and
  exfiltrated S3 data, mostly from an OVH VPS (57.129.54[.]120) and Mullvad VPN addresses. Sentra: dozens of victims, millions of
  files stolen from one customer, 100+ passwords and keys read within minutes. Wiz also saw a separate, unlinked Qubole-related
  set of activity (8-11 Oct) using customer-owned AWS access keys. AWS: its services were not compromised. On 16 Nov n0n leaked
  Chase, Visa and Mastercard data on its extortion site; on 20 Nov Chase said third-party service providers were attacked and
  marketing data accessed (BleepingComputer links this to Qubole; Qubole had not commented).
