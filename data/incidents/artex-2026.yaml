summary: >
  ARTEX, an open-source autonomous multi-agent AI penetration-testing framework published in July 2026 (closed-sourced on 8 Oct
  after 12,000+ forks), has been used by several unrelated actors; Talos says it is largely used by financially motivated criminals
  and China-nexus actors, so ARTEX use alone does not identify an actor. An LLM planner drives worker agents running nmap, nuclei,
  httpx, ffuf and curl. CrowdStrike: an unnamed, likely Chinese-speaking, financially motivated actor breached South Korean bank
  systems and exfiltrated data (late Sep to early Oct). Microsoft: China-state aligned Storm-0940 password-sprayed 2,250+ tenants
  (10-14 Oct) and abused ConnectWise multi-tenant application credentials for a supply-chain compromise, in some cases gaining
  privileged cloud access in under 3 hours; Wiz saw the same actor expand to other IT and software vendors. Unit 42: intrusion
  attempts (24 Sep-27 Oct) harvested JS source maps and OpenAPI specs, probed OAuth flows, self-registered accounts and read
  ~50 MB of API data; infrastructure serves WWW-Authenticate Basic realm="ARTEX" and a Sub2API LLM gateway. FBI FLASH-20261113-001
  (TLP:CLEAR) gives network and behavioral IOCs, names no state sponsor, and lists Storm-3358 WISP C2 nodes and ARTEX servers
  (Microsoft). SentinelOne ties VAPOR PANDA's ARTEX use to BLOODALCHEMY malware. Separately, BadByte found trojanized ARTEX Docker
  images (tomicdd/artex, congdonglinux/artex; 7,946 pulls) whose /app/artex binary runs the login request's captcha field via
  sh -c as root before authentication, i.e. anyone running that image was exposed; Docker removed both images on 5 Nov 2026.
cves: []
