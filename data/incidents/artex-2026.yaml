id: artex-2026
name: ARTEX agentic AI penetration-testing framework abused in intrusions
category: tool-abuse
status: ongoing
activity: 2026-09 to 2026-11
disclosed: 2026-10-07
updated: 2026-11-19
victims: >
  Hundreds of organizations; South Korean banks (loan-inquiry and employee mobile systems); IT and software vendors and their
  downstream Microsoft 365 tenants via ConnectWise multi-tenant app credentials; exposed web APIs and identity providers
sectors: [Financial services, Cryptocurrency, Government, Telecommunications, Defense, Aerospace, Semiconductors, Technology, Software, Pharmaceuticals]
countries: [South Korea, Southeast Asia, Global]
attribution: MIXED
actors:
  - name: Storm-0940
    attribution: "Microsoft: China-state aligned actor"
  - name: Vapor Panda
    attribution: "CrowdStrike (via Talos): China-nexus espionage campaign from 17 Oct 2026"
  - name: Storm-3358
    attribution: "Talos: financially motivated, Cambodia-based, targets financial organizations in Southeast Asia"
  - name: Unnamed Chinese-speaking actor
    attribution: "CrowdStrike: likely Chinese-speaking and financially motivated (moderate confidence)"
summary: >
  ARTEX, an open-source autonomous multi-agent AI penetration-testing framework published in July 2026 (closed-sourced on 8 Oct
  after 12,000+ forks), has been used by several unrelated actors; Talos says it is largely used by financially motivated criminals
  and China-nexus actors, so ARTEX use alone does not identify an actor. An LLM planner drives worker agents running nmap, nuclei,
  httpx, ffuf and curl. CrowdStrike: an unnamed, likely Chinese-speaking, financially motivated actor breached South Korean bank
  systems and exfiltrated data (late Sep to early Oct). Microsoft: China-state aligned Storm-0940 password-sprayed 2,250+ tenants
  (10-14 Oct) and abused ConnectWise multi-tenant application credentials for a supply-chain compromise, in some cases gaining
  privileged cloud access in under 3 hours; Wiz saw the same actor expand to other IT and software vendors. Unit 42: intrusion
  attempts (24 Sep-27 Oct) harvested JS source maps and OpenAPI specs, probed OAuth flows, self-registered accounts and read
  ~50 MB of API data; infrastructure serves WWW-Authenticate Basic realm="ARTEX" and a Sub2API LLM gateway.
cves: []
techniques: [T1583.003, T1588.007, T1090]
