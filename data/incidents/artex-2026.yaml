notes: >
  Talos and Unit 42 note that not all ARTEX activity is malicious (it is also used for authorized testing), so these IPs are
  indicators to investigate rather than block outright. Generic user agents (curl, python-requests, Python-urllib) are omitted.
  SentinelOne's appendix also lists SHA-256 hashes for VAPOR PANDA's GameHook binary and BLOODALCHEMY loader/payload, an ARTEX TLS
  certificate hash and Hunt.io-sourced IPs; they were not added because the page could not be read verbatim past mid-appendix.
