id: fincen-2026
name: US Treasury FinCEN intrusion forcing systems offline
category: breach
status: ongoing
activity: 2026-11 (dates not reported)
disclosed: 2026-11-24
updated: 2026-11-25
victims: >
  US Treasury Financial Crimes Enforcement Network (FinCEN); "unauthorized access to a limited subset of its systems" per
  FinCEN's notice on the BSA E-Filing website. Data accessed not disclosed.
sectors: [Government, Financial]
countries: [United States]
watch: true
keywords: [FinCEN, Treasury, BSA E-Filing]
attribution: UNATTRIBUTED
actors: []
summary: >
  FinCEN posted a banner on the BSA E-Filing site on the evening of 24 Nov 2026 saying it is "investigating a cybersecurity
  incident" that "resulted in unauthorized access to a limited subset of its systems" and that "As a proactive measure, FinCEN
  has taken some systems offline. The BSA E-Filing website remains operational; however, some services may be temporarily
  unavailable." Nextgov reports a FinCEN order (ORDER-FIN-2026-R002) giving institutions that used the automated submission
  channel as of 18 Nov until 30 Dec to file reports otherwise due 18 Nov to 29 Dec; the Financial Institutions Hotline remains
  available for urgent law-enforcement reporting. FinCEN "did not disclose what data may have been accessed or say who was
  responsible" (Nextgov); "No hackers have taken credit for the attack" (The Record). First reported by The Verge. Disclosed the
  same week as the CIA/ODNI, FBI NCIC and USDA incidents; officials have not linked them.
