summary: >
  On the night of 1 Nov 2026 an attacker "gained access to the management layer of its entire architecture and then executed
  data-zeroing scripts" (BleepingComputer, citing Beget), wiping all cloud-infrastructure data: VPS, S3 and Kubernetes, plus CDN
  settings and IP configurations. VPS binary backups were "completely lost"; file backups survived for about half of VPS users,
  and Beget said "it is impossible to recover all data". The Record: the attack "disrupted hundreds of websites", including the
  Naryan-Mar city administration site and Chestny Znak; Beget has not disclosed initial access and found no evidence customer
  data was downloaded or modified, and urged customers to change passwords and access keys. About 1,000 servers needed manual
  inspection; by ~9 Nov 60% of shared hosting and 40% of dedicated servers were restored. Beget was sanctioned by the EU earlier
  in 2026. "No hacking group has publicly claimed responsibility for the incident" (The Record).
