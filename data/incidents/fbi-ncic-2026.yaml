summary: >
  CNN (20 Nov, citing two people briefed on the investigation), Fox News (three sources) and AP reported that the FBI is
  investigating an apparent breach of NCIC, which holds wanted and missing persons, warrants, stolen vehicles and firearms,
  protection orders and other criminal justice records. It is unclear when or how attackers gained access, whether records
  were accessed or whether availability was affected. The FBI has not publicly confirmed the incident and declined to comment
  to AP; President Trump said "We just heard about it and I will say that it's not good." BleepingComputer: "There is currently
  no indication that the latest NCIC incident is connected to ShinyHunters or the earlier breach" (the September ShinyHunters
  claim against a platform tied to FBIJobs.gov).
