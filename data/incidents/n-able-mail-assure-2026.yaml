summary: >
  The Hacker News (citing N-able): an outage of the Mail Assure and SpamExperts Hosted Cloud dashboard and APIs began the week of
  16 Nov and was first traced to "platform configuration and service dependencies"; N-able then said it was a security incident in
  which "an unauthorized party had accessed one of the Hosted Cloud servers". N-able took the server offline, rotated internal
  platform credentials, revoked customers' API tokens, invalidated OAuth tokens and reset local user passwords; dashboard and APIs
  were restored late Saturday (about 21 Nov); mail delivery and filtering kept working. N-able has "found no evidence that customer
  data was compromised, including tenants' mailboxes". During the investigation N-able disclosed CVE-2026-134624 (CVSS 4.0 9.3), an
  SSRF in the LDAP-sync connection check: "An authenticated API user can cause the server to connect to arbitrary internal hosts and
  ports"; fixed in build 20261121.1943. N-able has not said whether the flaw was the entry point; an outside DFIR team is engaged and
  root-cause analysis is due within two weeks. Unrelated to the separate N-central hosted platform shutdown of 9 Nov.
