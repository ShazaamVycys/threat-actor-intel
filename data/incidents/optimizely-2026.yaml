id: optimizely-2026
name: Optimizely supply-chain attack injecting malicious JavaScript into 178 organizations' websites
category: supply-chain
status: contained
activity: 2026-11-16 (injection from ~04:21 UTC; cleaned by ~23:11 UTC)
disclosed: 2026-11-16
updated: 2026-11-24   # CISA KEV entry for CVE-2026-132224 added 2026-11-24; Zscaler ThreatLabz report read 2026-11-23; Socket (11-18) and CSO Online (11-17) read 2026-11-24
victims: >
  188 Optimizely JavaScript files belonging to 178 organizations (Report URI), including Zoom, CNN, Fox News, BBC, Salesforce,
  GitLab, KLM, Air France, HSBC Insurance, Bitly, Smartsheet, Change.org and UNICEF USA; their site visitors were exposed. Zscaler ThreatLabz saw more than 450 unique domains and more than
  3,000 URLs serving the malicious script (airlines/travel, banking/finance, e-commerce, retail, telecommunications)
sectors: [Technology, Media, Retail, Travel, Financial services]
countries: [Global]
watch: true
keywords: [Optimizely, 1688360.cc, eil786npto9u5bq.icu, 5vobauua3ojpklx.icu, ios-hack.icu, q1ls1ho9x7wsxlu.icu, Coruna, DarkSword, CVE-2026-132224]
attribution: UNATTRIBUTED
actors: []
summary: >
  Optimizely: an unauthorized party "exploited a vulnerability in the Experimentation account signup flow" and injected malicious
  JavaScript into customer projects; Optimizely blocked the path, removed the code, revoked sessions and tokens and reset affected
  accounts. Report URI (Scott Helme) found 188 infected files of 178 organizations among 1,611 scripts analysed. The injected code
  loaded track.js from 1688360[.]cc, which replaced cryptocurrency wallet addresses, skimmed payment-card data (to card.php),
  collected cookies, URLs and screenshots, and delivered the Coruna and DarkSword iOS exploit kits to vulnerable iPhones and iPads.
  About $7,000 had reached the attacker wallets by 16 Nov (Helme). Salesforce disabled Optimizely scripts across its instances.
  Zscaler ThreatLabz (18 Nov) describes unauthorized write access to the Project JavaScript (projectJS) field across multiple
  customer projects via the signup-flow flaw, a hidden iframe to eil786npto9u5bq[.]icu and iOS exploit-kit entry paths. No actor named.
cves: [CVE-2026-132224]
techniques: []
