notes: >
  Network IOCs transcribed from BleepingComputer's IOC table. The table's ten attacker cryptocurrency wallet addresses (BTC, LTC,
  TRX, ETH/BSC, SOL, TON, BCH, DOGE) are left out (not a supported IOC type; some were active before the attack). Report URI's own
  post was not read directly. Coruna and DarkSword are named iOS exploit kits; no CVEs were listed in the reporting read.
  Zscaler ThreatLabz domains were read via a fetched copy of the page, not checked character by character against
  the live page: verify before blocking. Left out from Zscaler's table: five URLs on those domains (listed without a scheme, so
  not accepted by the build: 1688360[.]cc/hit.php, /html2canvas.min.js; eil786npto9u5bq[.]icu/boot.js, /JIUJIU888/weifile.html;
  5vobauua3ojpklx[.]icu/boot.js), nine attacker wallet addresses, generic script names
  (track.js, boot.js, weifile.html, index.js, html2canvas), iOS exploit-kit entry paths (A8/a.html etc.) and the follow-on
  module IDs/paths (40-hex names, not file hashes).
  CISA added CVE-2026-132224 to KEV on 2026-11-24: "external control of critical state data vulnerability in its account signup
  flow that could allow an attacker to impersonate existing customer users and modify Project JavaScript" (due 2026-11-27); KEV
  links Optimizely's "Security Incident Report - Optimizely Web Experimentation - Nov 17 2026" PDF (not read). Sophos X-Ops post
  has no IOC table (detection Troj/JSInj-H).
  Socket's hash was read twice via fetched copies of the page and matched; its other indicators (1688360[.]cc, 5vobauua3ojpklx[.]icu,
  /track.js, /boot.js, page marker window._k7) are already listed or not a supported type. ReversingLabs' OptimJack post
  could not be read (body not extracted). CSO Online quotes Report URI's Scott Helme: attackers "almost certainly coming from
  China" ("They are either Chinese or they really want us to think that they are Chinese"); he considers state actors unlikely.
