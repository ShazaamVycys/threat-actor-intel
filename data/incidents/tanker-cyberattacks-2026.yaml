summary: >
  The Wall Street Journal reported on 23 Nov 2026 (Reuters, which "could not immediately verify the report") that the US is
  investigating Iran's potential involvement in cyberattacks on as many as 50 ships carrying oil, liquefied petroleum, chemical
  products and other explosive substances; some ships also received warnings and bomb threats. Maritime Executive, citing the WSJ:
  reports of attacks on tankers far from the Middle East first appeared in August, when at least two tankers bound for Texas were
  targeted and the US Coast Guard boarded them for inspection before letting them approach US ports; at least four more ships were
  boarded in recent weeks. US Coast Guard Cyber Command and the FBI warned the attacks sought to exploit vulnerabilities in Fortinet
  FortiGate devices. VL Prosperity (HMM-managed VLCC) reportedly received a ransom note published in a Russian-language Telegram
  posting and a bomb threat; a European shipowner reported threatening messages, some in Farsi. US officials suspect Iran is likely
  behind the attacks, though some raised questions about Russia; a Trump administration official called the incidents "little more
  than a minor nuisance" and the administration says no evidence of Iranian involvement has been found.
