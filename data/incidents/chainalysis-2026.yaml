id: chainalysis-2026
name: Chainalysis platform breach exposing all users' credentials and tokens
category: breach
status: contained
activity: 2026-10 to 2026-11-04
disclosed: 2026-10-30
updated: 2026-11-19   # Chainalysis incident page (updates to Nov 10; modified 2026-11-19) read 2026-11-24
victims: >
  Chainalysis (blockchain analytics provider to law enforcement, government and crypto businesses); names, usernames, password
  hashes and live tokens of all users exposed; a subset of customer passwords exposed earlier via an on-path attack
sectors: [Technology, Cryptocurrency, Government]
countries: [United States, Global]
watch: true
keywords: [Chainalysis, Reactor, KYT, Address Screening, agentic]
attribution: UNATTRIBUTED
actors: []
summary: >
  Chainalysis incident page: on 30 Oct Chainalysis said it "was recently the target of a cybersecurity incident" by "an external actor
  using offensive agentic techniques"; "Some non-sensitive customer data, such as user IDs, full names, email addresses, and organization
  role labels" was accessed. Reactor and Data Solutions were taken offline as a precaution on 2 Nov. On 4 Nov it said customer passwords
  were exposed in an "on-path attack", since "contained and remediated", and that KYT and Address Screening were taken offline after
  "abnormal activity"; it found "certain customer information including names, usernames, password hashes and live tokens for all
  Chainalysis users were exposed to a malicious actor". Users were told to reset passwords and rotate API keys. Services were restored in
  phases on 6-7 Nov (KYT, Address Screening, Reactor) and 10 Nov (Data Solutions). No evidence that investigation content was accessed.
  Chainalysis: "This security incident is not related to the recent crypto theft at Binance." No actor named.
