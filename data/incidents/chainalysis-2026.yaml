notes: >
  Facts from Chainalysis' own incident page (read 2026-11-24). Its 30 Oct entry said there was no evidence of access to authentication
  credentials or session tokens; the 4 Nov entry supersedes that. No IOCs, CVEs or attribution published. The IPs in The Hacker News'
  11-06 article relate to separate LLM-token-abuse reporting and were not keyed in. THN mentions Vapor Panda/ARTEX only as context, with
  no link to Chainalysis. Set watch to false if nothing new by mid-December.
