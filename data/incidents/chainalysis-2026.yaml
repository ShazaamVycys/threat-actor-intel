notes: >
  Chainalysis' own blog could not be read in this run; facts are The Hacker News' account. No Chainalysis-specific IOCs published; the
  IPs in the THN article relate to separate LLM-token-abuse reporting (Google/Wiz) and were deliberately not keyed in. Possibly part of
  the wider agentic-attack wave on tech platforms (see incidents artex-2026 and ai-inference-providers-prompt-theft-2026), but no source
  links them directly.
