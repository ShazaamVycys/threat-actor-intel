summary: >
  Equinor detected a cyberattack against certain IT systems on 17 Nov 2026 and worked with Norwegian national security
  authorities to neutralise it; Reuters (via The Record) reported internal email was down. Oil and gas production was not
  disrupted. On 20 Nov Equinor said "The cyber-attack against Equinor has now been stopped", with no sign that data was stolen or
  altered, and that it had been reported to the police. Equinor has not identified the attackers. Dark Reading: a second
  Norwegian energy company, Skagerak Energi (power utility), reported an attack on its IT systems on 18 Nov that "didn't impact
  operations or production", with "no indication that any data had been lost"; "there is no evidence yet that the two attacks
  are connected".
