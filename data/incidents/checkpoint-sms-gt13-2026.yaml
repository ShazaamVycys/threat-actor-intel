id: checkpoint-sms-gt13-2026
name: GT13 intrusion campaign against Check Point Security Management servers (24 servers, 22 organizations)
category: exploitation
status: ongoing
activity: 2026-10-02 to 2026-11-02 (GreyNoise expects the campaign is ongoing)
disclosed: 2026-11-23
updated: 2026-11-24
victims: >
  GreyNoise: 24 Check Point Security Management servers compromised across at least 22 organizations; victim assets in the UK,
  Ireland, France, Netherlands, Greece, Germany, Austria, Bulgaria, Poland, India, Thailand, Vietnam, South Korea, Hong Kong,
  China, Australia and the US. SecurityWeek lists energy, engineering, financial services, government, manufacturing, mining
  and transportation. Targeting "does not appear to be focused on any specific geography or industry sector" (GreyNoise).
sectors: [Energy, Engineering, Financial Services, Government, Manufacturing, Mining, Transportation]
countries: [United Kingdom, Ireland, France, Netherlands, Greece, Germany, Austria, Bulgaria, Poland, India, Thailand, Vietnam, South Korea, Hong Kong, China, Australia, United States]
watch: true
keywords: [GT13, Check Point, Security Management, SmartConsole, CVE-2026-16232, CVE-2026-61500, Rejetto, HFS, ZULT, newpayapp]
attribution: UNATTRIBUTED
actors:
  - name: GT13
    attribution: "GreyNoise: 'We do not attribute GT13 to any known or publicly tracked threat group at this time. We do not currently have enough information to make assessments relating to the motivation of the actor or alignment to a nation-of-origin.'"
summary: >
  GreyNoise ("99 IPs but a C2 ain't one", 23 Nov 2026): an actor it tracks as GreyNoise Threat 13 (GT13) gained access to a
  Rejetto HFS server via CVE-2026-61500 (forging an admin session cookie after recovering the signing key) and used it as a hop
  for exfiltration and for access to Check Point Security Management servers, where CVE-2026-16232 (SmartConsole auth bypass to
  Run Script) was used to run commands. Data from 24 management servers was collected on the hop, including firewall databases,
  Internal CA files, credentials, firewall configuration and a newly minted certificate (pivot.p12); the actor also attempted to
  unload security policies. Tooling: Nmap, Chisel, Impacket, Paramiko and 30+ Python scripts; persistence via /etc/ld.so.preload
  (/usr/lib/.libproc.so) and appended SSH keys; a "ZULT" implant downloaded from data-zt.newpayapp.com. GreyNoise also describes
  probing of other edge and internal services (Citrix NetScaler, Ivanti, Exchange, VMware vCenter, NetLogon, Oracle TNS). Traffic
  came from ExpressVPN egress IPs or compromised victim devices. GreyNoise believes the actor used "LLMs and agentic systems" for
  scanning, exploitation, tool development and automated interaction, alongside hands-on-keyboard activity.
cves: [CVE-2026-61500, CVE-2026-16232]
