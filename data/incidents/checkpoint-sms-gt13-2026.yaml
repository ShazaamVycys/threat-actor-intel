notes: >
  Not captured: the ~69 IP rows in GreyNoise's Indicators table (all tagged AS206092 ExpressVPN egress, each with its own
  activity window); shared commercial-VPN addresses with high false-positive risk and the table was read in two passes, so take
  them from the GreyNoise page directly. No file hashes published; the post links a full GreyNoise Labs version that was not
  found (link is a placeholder). No Check Point advisory or statement cited as of 2026-11-24. GreyNoise notes the domain's
  registrant data (Hai Phong, VN) "may be a UTC+7-friendly coincidence"; not treated as attribution.
