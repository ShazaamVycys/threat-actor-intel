id: usaf-cloud-one-2026
name: Breach of the US Air Force Cloud One enterprise cloud platform
category: breach
status: ongoing
activity: 2026-10/11 (discovered "within the past month" during a platform upgrade; dates not reported)
disclosed: 2026-11-27
updated: 2026-11-27   # Reuters exclusive 11-27 via BleepingComputer 11-27 read 2026-11-27, Military.com 11-27 read 2026-11-28; Reuters original not read
victims: >
  US Air Force Cloud One, an Air Force-managed enterprise cloud hosting DoD applications for military operations,
  personnel management, logistics and maintenance. Potentially exposed: "sensitive military operational and logistics
  information" (per reporting); scope and data theft unknown.
