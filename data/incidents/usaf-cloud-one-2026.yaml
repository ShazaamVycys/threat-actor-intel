summary: >
  Reuters (exclusive, 27 Nov 2026), relayed by BleepingComputer: hackers breached the US Air Force's Cloud One computing platform.
  A source told Reuters the attackers "exploited an unidentified software vulnerability"; the intrusion was discovered within the
  past month during an upgrade of the platform, disrupting application migrations and software updates. US Cyber Command has
  reportedly been called in to assess impact. Attackers, scope and data theft are "currently unknown". The Air Force declined to
  comment on the security or operational status of the affected systems. BleepingComputer: it is "unknown whether ARTEX or other
  AI-powered hacking tools were used" and "unclear whether any of the recently disclosed federal government breaches are connected".
  Military.com (27 Nov, citing Reuters' five anonymous sources; it "could not independently confirm the report"): Cloud One
  (launched 2017, built on Amazon, Microsoft, Google and Oracle clouds) hosts payroll and personnel records, aircraft maintenance
  logistics, the Cloud-Based Command and Control system that processes North American air defense radar feeds, and the Theater
  Integrated Combat Munitions System; back-office migrations were paused, application updates blocked and some users'
  administrator rights revoked (one source).
