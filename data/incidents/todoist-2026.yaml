attribution: UNATTRIBUTED
actors: []
summary: >
  TechCrunch (25 Nov, citing Todoist): using stolen credentials, an attacker accessed Todoist's version-control system and source
  code on 22-23 Nov, changed employee access controls and reached the cloud infrastructure through an employee's work account.
  Stolen: email addresses, password hashes and account creation dates (early users' older-format hashes downloaded); API and Slack
  integration tokens; for Todoist for Outlook users, emails, addresses and attachment file names where connected. For about
  0.001% of users the attacker searched tasks, comments and attachment names for credentials such as API keys and tokens. Todoist
  says no source code was changed and it has reset internal access and remote command execution in its cloud environment.
  Todoist "blamed stolen credentials"; no actor named.
