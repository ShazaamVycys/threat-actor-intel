summary: >
  Nextgov/FCW (19 Nov, three sources and an internal email): USDA's Cybersecurity and Privacy Operations Center "uncovered a
  security incident" that required resetting "all database passwords in all environments", taking numerous applications offline
  over several days; "It's not clear who carried out the intrusion or if any data was exfiltrated." DTN (updated 20 Nov):
  Undersecretary Richard Fordyce called it a "cyberthreat", not a software update: "There was no Personally Identifiable
  Information (PII). No data was lost because the systems that protect against cybersecurity threats worked," and said most
  systems should be back online by close of business 20 Nov. NBC News (not read) reported USDA was breached by hackers.
