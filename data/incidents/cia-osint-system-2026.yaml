summary: >
  First reported by The New York Times on 24 Nov 2026. AP (via a person familiar with the incident): "an unclassified CIA system"
  that handles open-source intelligence was breached; "The breach did not involve any classified information and the issue has
  been resolved"; "It was not clear what specific information was compromised or who was responsible." CyberScoop says it confirmed
  the breach of "an open-source intelligence analysis system" affecting the CIA and ODNI; its source says exposure was limited,
  it "did not involve our classified networks or classified information", and "there was a disruption". CIA declined to comment
  to CyberScoop; ODNI did not immediately respond. Reporting places it alongside an NSA classified-network outage and FBI
  database intrusions; AP says the administration describes the outages as not part of a coordinated cyberattack.
  Update 25 Nov: TechRadar, relaying the NYT, says attackers "exfiltrated collected data" from the system and names the National
  Geospatial-Intelligence Agency alongside CIA and ODNI; "NYT says initial signs, including the use of ARTEX, suggests that China
  may be behind it" (two people familiar with the breach). China calls the allegations "baseless". ODNI (via Bloomberg): "there
  have been no disruptions to critical capabilities or classified systems." No claim of responsibility.
