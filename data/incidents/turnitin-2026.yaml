victims: >
  Turnitin (academic-integrity software; per its website used by over 16,000 institutions in 185 countries and 71 million
  students). Turnitin reports "unauthorized activity involving certain customer-facing Turnitin systems"; whether user data was
  accessed, when it happened and how many people were affected were not disclosed.
