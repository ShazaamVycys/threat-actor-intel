id: austria-foreign-ministry-2026
name: Austrian Foreign Ministry website breach exposing staff contact details
category: breach
status: contained
activity: 2026-11-12 to 2026-11-13
disclosed: 2026-11-20
updated: 2026-11-21
victims: >
  Austrian Federal Ministry for European and International Affairs; website run by an external service provider; names and work
  contact details of staff at headquarters in Vienna and at diplomatic missions abroad were viewed
sectors: [Government, Diplomatic]
countries: [Austria]
watch: true
keywords: [Austrian Foreign Ministry, Austria, BMEIA, Aussenministerium]
attribution: UNATTRIBUTED
actors: []
summary: >
  Ministry statement (quoted by Security Affairs, citing Reuters and ORF): "Between November 12 and 13, the foreign ministry's
  website, which is operated by an external service provider, was accessed in an unauthorized manner"; the investigation found
  "data records were viewed that listed the names and work contact details of employees" in Vienna and at missions abroad.
  Detected 13 Nov and stopped immediately; citizens' personal data not affected. The ministry did not suggest who was responsible;
  the Federal Office for Cyber Security and the Data Protection Authority were notified (ORF). Number of records, entry method and
  whether data was copied were not disclosed.
