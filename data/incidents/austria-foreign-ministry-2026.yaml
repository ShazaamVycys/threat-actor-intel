notes: >
  No IOCs, CVEs or attribution published as of 2026-11-22. Reuters and ORF pages were not read directly; facts are from Security
  Affairs' quotation of the ministry statement. Security Affairs notes Vienna publicly blamed Russia in July 2026 for a 2019-2020
