summary: >
  The European Commission confirmed that hackers attacked it in late October 2026 (detected 22 Oct, confirmed 26 Oct) and that an
  AI tool was used; several applications were taken down "as a protective and preventive measure" and most have been restored.
  Spokesperson Thomas Regnier did not attribute the attack to a known group, did not name the AI tool, said no data breach
  affecting staff had been found and knew of no ransom demand. Politico (via SecurityWeek) reported that attackers potentially
  compromised large amounts of data and disruption lasted over 10 days. SecurityWeek places it alongside CERT-EU's warning about
  ARTEX, but the Commission has not said ARTEX was the tool.
