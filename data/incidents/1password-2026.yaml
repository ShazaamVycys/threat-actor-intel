summary: >
  BleepingComputer and TechCrunch (25 Nov, citing 1Password's disclosure): 1Password began investigating on 19 Nov after signs that
  an employee's corporate GitHub account was compromised. The attacker accessed private source-code repositories and pushed
  malicious code to backend services that downloaded customer account records: names, login email addresses, account and user
  IDs, account creation and last sign-in times, public cryptographic keys, SRP parameters, invitation/provisioning/account-recovery
  tokens and other account metadata; internal source code and CI/CD environment access (potentially exposing internal
  infrastructure credentials) were also involved. 1Password says vaults, Secret Keys and passwords were not exposed and it found no
  evidence of account takeovers; it disabled the account, revoked the stolen token and lengthened verification codes. How the
  GitHub account was compromised is unclear (TechCrunch). No actor named.
