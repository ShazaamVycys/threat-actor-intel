summary: >
  Flight Centre told the ASX on 26 Nov 2026 that it found "unusual activity" in a third-party (unnamed) accommodation booking
  system used by several of its booking agencies, and that "a significant number of customer records" may have been accessed by
  "unknown persons"; it does not yet know how many records were extracted. Exposed data includes names and basic travel
  information and, for a "very small percentage" of the compromised data, "limited passport details, email addresses, phone
  numbers, birth dates, or in rare cases health or mobility information". Payment and banking details, flight bookings and
  corporate travel bookings are not affected at this stage. Flight Centre is notifying the relevant authorities and has engaged
  Mandiant. No threat actor or ransomware claim has been reported.
