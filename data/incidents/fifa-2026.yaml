summary: >
  FIFA said on 26 Nov 2026 that it "has been the victim of a criminal cyberattack resulting in unauthorised access to a limited
  set of personal and business information", condemned the "unlawful acquisition and publication of information, particularly
  personal data", and is working with authorities including law enforcement. It did not say when the attack happened, how many
  people were affected or what business data was taken. The Handsome Boy Hacking Club posted a screenshot of claimed FIFA files on
  X the previous week and appeared to take credit for releasing more than 12 GB of internal documents (AP); IBTimes, citing The
  Record, says the group allegedly tried to extort FIFA and claims ID documents, financial records and internal correspondence
  (unconfirmed). A Reuters source said less than 0.1% of FIFA's data was affected and FIFA Forward Enterprise project files were not
  accessed; a FIFA source told The Athletic the attacker gained access by impersonating staff rather than through a technical failure.
  No impact on World Cup operations or ticket holders has been reported.
