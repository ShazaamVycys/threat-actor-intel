countries: [Global]
attribution: STATE
watch: true
keywords: [Binance, TraderTraitor]
actors:
  - name: TraderTraitor
    attribution: "FBI and US Secret Service: North Korea's TraderTraitor (North Korea denied involvement)"
summary: >
  FBI and USSS attributed the theft to North Korea's TraderTraitor and urged exchanges and DeFi operators to block transactions
  with or derived from its addresses; stolen funds were converted mainly to Ethereum. Binance's post-mortem describes a
  months-long campaign from June 2026: a fake job interview with a malicious coding assignment and "AI coding tool" installer
  compromised an employee device (~September), the attacker evaded EDR, moved laterally from 20 Oct, reached wallet tooling by
  29 Oct and used compromised credentials to authorize transactions. Elliptic traced ~12,000 wallets across 11 blockchains.
