notes: >
  IOCs transcribed 2026-11-23 from the StepSecurity, Aikido and Wiz IOC tables (verbatim page text; hashes agree across StepSecurity,
  Socket, Aikido and Wiz) - verify before blocking. Left out: the generic file name _telemetry.py on its own, the package versions
  (agent-framework==1.26.1/1.26.2, not an IOC type) and the network signature Content-Type application/octet-stream. Times differ
  slightly between vendors (1.26.1 removal: StepSecurity 21:06:16 UTC; all gone "by 21:20 UTC" per Aikido, "as of 21:30 UTC" per
  Wiz). StepSecurity's timeline lists a maintainer account "vibiret" created and added to the project but says the uploader's
  identity is not established. OX Security and Endor Labs pages were not read.
