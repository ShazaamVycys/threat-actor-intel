id: microsoft-agent-framework-pypi-2026
name: Microsoft Agent Framework PyPI package compromised with a cloud-credential stealer
category: supply-chain
status: contained
activity: 2026-11-17 (1.26.1 uploaded 20:35:20 UTC; 1.26.2 21:08:39 UTC; both gone by ~21:20-21:30 UTC)
disclosed: 2026-11-17
updated: 2026-11-20   # StepSecurity 11-18, Wiz update 11-18, Microsoft response via The Hacker News 11-20
victims: >
  Users and CI pipelines that installed agent-framework 1.26.1 or 1.26.2 from PyPI during the exposure window; the package has
  about 190,000 downloads a month (Aikido). Wiz saw 50 requests captured by the webhook.site endpoint, 17 of them representing
  three unique, successful cases of victim-data exfiltration
sectors: [Technology, Software]
countries: [Global]
watch: true
keywords: [agent-framework, agent_framework_meta.pth, af_runtime_diag.pth, af_runtime_diag.py, _AF_TEL, runtime-diagnostics/1, af-runtime-diagnostics/1, ESRP, Cairn]
attribution: UNATTRIBUTED
actors: []
summary: >
  Two malicious releases of Microsoft's official agent-framework Python package (1.26.1 and 1.26.2) were published to PyPI 33
  minutes apart on 17 Nov 2026 and quarantined (StepSecurity: 1.26.1 at 21:06:16 UTC, 1.26.2 at 21:16:44 UTC). Each added a .pth
  start-up hook (agent_framework_meta.pth in 1.26.1, af_runtime_diag.pth in 1.26.2) that runs the stealer on every Python start
  without importing the package. It harvests environment variables, /proc/*/environ, Azure CLI files, .npmrc, pip.conf, .netrc,
  .git-credentials and Docker config, tries to mint Azure DevOps OIDC, Azure managed-identity and (1.26.2) GitHub Actions OIDC
  tokens, and POSTs zlib-compressed, Base64-encoded data to a webhook.site URL. Aikido: the releases were uploaded "with valid
  publishing credentials"; Wiz: the attacker "appears to have compromised a client certificate and private key for Microsoft
  ESRP" (a first publish attempt from AWS was rejected by ESRP IP filtering, a second from Microsoft-owned IP space succeeded); how
  the credentials were obtained is not known. Wiz says the tooling identifies itself as Cairn, an open-source AI penetration-testing
  framework, and has not linked the incident to the earlier durabletask compromise. Microsoft made some repositories private
  (including microsoft/agent-framework and microsoft/onnxruntime) "while we investigate malicious content". 1.26.0 is the last
  clean release; anyone who installed 1.26.1/1.26.2 should remove them and rotate exposed credentials. No actor named.
