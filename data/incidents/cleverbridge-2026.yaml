updated: 2026-11-23
victims: >
  Customers of software vendors that use Cleverbridge as reseller/payment processor, including "a small subset" of Malwarebytes
  customers (Malwarebytes support forum, as reported); overall number not disclosed
sectors: [Financial services, Technology, Retail]
countries: [Global]
watch: true
keywords: [Cleverbridge]
attribution: UNATTRIBUTED
actors: []
summary: >
  BleepingComputer (headline "Cleverbridge warns hackers stole credit card numbers, CVVs in data breach") reported a Cleverbridge
  customer notice. As relayed by Business Upturn (22 Nov): Cleverbridge confirmed "an intruder copied payment card data from its
  platform"; unauthorised activity was detected on 4 Nov, systems were temporarily shut down and restored that day, and notification
  of affected individuals began on 20 Nov. Copied data: card number, expiry date and CVV/CVC; per the notice names, contact and
  billing details were not copied. The company says no systems were encrypted and has not said how the attacker got in. TransUnion's
  Cyberscout handles notifications. No actor named. The Register (23 Nov, citing a customer email): email addresses, billing
  addresses and phone numbers were "potentially exposed"; passwords not affected; Cleverbridge contacted data protection
  authorities, card schemes and payment partners and is working with a police cybercrime unit; 24 months of credit monitoring
  offered. Number affected and dwell time not disclosed.
