id: ai-inference-providers-prompt-theft-2026
name: Months-long prompt theft at AI inference providers (OpenRouter removes three providers)
category: data-theft
status: ongoing
activity: 2026-07 to 2026-11
disclosed: 2026-11-22
updated: 2026-11-22
victims: >
  Three unnamed AI inference providers removed by OpenRouter (125 endpoints dropped from Zero Data Retention eligibility) and the
  users whose prompts they processed; separate incidents disclosed by Phala (inference server taken over) and Together AI (stored
  prompt samples from June-July 2026 downloaded). Dragos is working with about a dozen providers
sectors: [Technology, Cloud]
