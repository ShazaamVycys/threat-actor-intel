actors: []
summary: >
  Dragos seeded about two million prompts with canary links and credentials (July to November 2026) and caught attackers
  harvesting prompts at AI inference providers for months, the earliest breach starting in mid-July. The largest case involved
  "a couple hundred AWS keys" taken from prompts and used for tens of thousands of AWS API calls (late October). One attacker
  "appears to have compromised two of the providers at once" and used the ARTEX AI pentest framework on 1 Nov (user agents
  artex-agent and artex-judge-r121; see [[artex-2026]]); separately, an unnamed Chinese AI lab fetched secret links from seeded
  prompts. OpenRouter removed three providers and 125 endpoints from Zero Data Retention eligibility and says OpenRouter itself was
  not breached; neither Dragos nor OpenRouter has named the three providers. Phala reported an attacker controlled an inference
  server from 21 Oct 00:00 UTC to 8 Nov 05:35 UTC; Together AI said an unauthorized party downloaded stored prompt samples after an
  AI coding agent committed a credential to a public GitHub repository; Novita posted a privacy notice. No actor named.
