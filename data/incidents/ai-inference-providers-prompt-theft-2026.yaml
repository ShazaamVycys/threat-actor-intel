summary: >
  Dragos (HD Moore, 19 Nov) sent about two million prompts seeded with canary URLs and credentials to AI services (July to
  November 2026) and found data from at least three AI hosting providers stolen, the earliest breach starting in mid-July and
  none of the three aware until notified. The largest case involved "a couple hundred" canary AWS keys sent to one provider in
  late-October windows, followed by tens of thousands of AWS API calls. "One adversary appears to have compromised two of these
  providers at the same time"; its tooling changed over three weeks and on 1 Nov it added the ARTEX LLM-driven pentest framework
  (user agents artex-agent and artex-judge-r121; see [[artex-2026]]). Dragos also found marketplace resellers retaining customer
  prompts through logging and providers not honouring privacy settings, including prompts reaching Chinese AI organizations.
  OpenRouter (22 Nov) off-boarded three providers it does not name, removed 125 endpoints from Zero Data Retention eligibility,
  notified affected customers and says OpenRouter itself was not breached; it lists provider statements from Atlas Cloud, Novita,
  Phala and Together. Phala (10 Nov): an attacker chained a legacy internet-facing service with management interfaces trusting
  loopback access, created unauthorized confidential VMs, took application credentials and controlled an inference VM serving
  DeepSeek V4 Flash 0731 requests routed by OpenRouter (exposure window 21 Oct 00:00 to 8 Nov 05:35 UTC); "a single actor
  conducted both intrusions". Together AI (21 Nov): an AI coding agent committed a credential for a private Hugging Face repository
  to the public GitHub repo "xorl"; an unauthorized party downloaded stored prompt samples (MiniMax M3, GLM-5.2, Kimi K2.6; June-July
  2026 requests), searched them for credentials and tested five Dragos canaries. No actor named.
