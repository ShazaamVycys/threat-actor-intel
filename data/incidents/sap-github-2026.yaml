victims: SAP SE (German enterprise software vendor); software development infrastructure / GitHub; SAP says no indication of access to customer business data so far
sectors: [Technology]
countries: [Germany]
watch: true
keywords: [SAP, Project Granite]
attribution: UNATTRIBUTED
actors: []
summary: >
  SAP said on the evening of 26 Nov 2026 that it had identified suspicious activities and taken countermeasures; according to
  Handelsblatt, at the current state of the investigation there are no indications of unauthorized access to customer business
  data. Der Spiegel, citing an insider, first reported a hacker attack in which authentication tokens of SAP employees were
  stolen and used to access SAP's GitHub presence; Cybersecurity News, relaying Spiegel, says the tokens were used to alter and
  copy source code and that an internal memo described the incident as active and run under the name "Project Granite"
  (Handelsblatt's company sources describe "Project Granite" as SAP's internal name for immediate measures protecting the
  development infrastructure). Per Handelsblatt, SAP restricted GitHub access, stopped automated processes in software
  development and rotated signing keys. Spiegel's insider said the attackers may have used AI agents (unconfirmed). It is not
  known whether any altered code reached customer-facing products.
