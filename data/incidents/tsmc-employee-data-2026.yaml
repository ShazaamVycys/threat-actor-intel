summary: >
  BleepingComputer (15 Nov 2026): on 8 Nov a forum user "SmithBianl" posted a 499-row sample claimed to come from 46,000 TSMC
  employee records (6.9GB), auctioned from 3 BTC with a threat to leak it free after 15 Nov. TSMC (SEC filing) confirmed "some of our
  current and former employee data was made available on an external website without authorization"; the leaked data matched
  "data stored in the system services of a cloud service provider" and TSMC has "found no evidence that TSMC's systems have been
  compromised". The provider is not named. TSMC is notifying staff and engaged a third-party cybersecurity firm.
