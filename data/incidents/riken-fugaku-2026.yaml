notes: >
  Per-system counts differ between notices: the Japanese notice gives 4,222 Fugaku users, the English notice 4,224 Fugaku plus 375 RIKYU
  (summing to 4,599, not the stated 4,597). No IOCs, CVEs, malware names or attribution published as of 2026-11-24. Watch for the
  investigation result and restart.
