notes: >
  No public IOCs: Bell shared IOCs privately with enterprise customers and CCCS and declined to share them with BleepingComputer.
  The CBC Bell MTS article (personal data of Bell MTS customers, Manitoba email outage tied to the attack per headlines) could not
  be read; MTS details unverified. "Agentic" is Bell's wording; BleepingComputer's inference that AI tools were used is its own.
  Number of affected customers not disclosed. No extortion claim reported as of 2026-11-23.
