summary: >
  BleepingComputer (20 Nov 2026): Bell confirmed that "an agentic threat actor accessed some of our systems" on 17 Nov 2026 and
  stole enterprise customer data from a pre-production environment of Bell's Maximo system (used to order and provision
  circuits): business contact details, ticket titles and some IP addresses of network elements; Bell said the dataset held no
  credentials or file attachments. Bell: "We currently do not know the attribution." Bell said it is sharing IOCs and
  threat-hunting information with enterprise customers and the Canadian Centre for Cyber Security. The Canadian Press (23 Nov):
  in a customer email Bell said an unknown party accessed an internal Bell system the previous Tuesday and data may have
  included names, mailing addresses, phone numbers, email addresses, account numbers, product information and last-payment
  date and amount; no credit card or bank account data. Bell removed the actor and contacted the RCMP cybercrime unit.
